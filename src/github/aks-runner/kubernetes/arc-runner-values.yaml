# =============================================================================
# ARC Runner Scale Set Helm Values 配置
# =============================================================================

# GitHub 配置
githubConfigUrl: "https://github.com/MoneyForge"
githubConfigSecret: "github-pat-secret"

# Runner 數量設定
minRunners: 0 # 閒置時縮減到 0，有作業時自動建立 Runner
maxRunners: 45 # 最大同時運行數量

# Runner Scale Set 名稱
runnerScaleSetName: "arc-runner-set"

# =============================================================================
# Runner Pod 配置 (執行 GitHub Actions jobs 的 Pod)
# =============================================================================
template:
  spec:
    # 確保 Runner 只跑在 Runner Pool
    nodeSelector:
      nodepool-type: runner

    # Runner 容器資源請求：避免 requests=0 導致 autoscaler 不擴節點、pod 過度打包
    # cpu=1/mem=2Gi → D4s_v3(4vCPU) 約 3 runner/node；不設 limit 以允許 burst 並避免 OOM 中斷 build
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command:
          - /home/runner/run.sh
        resources:
          requests:
            cpu: "1"
            memory: 2Gi

    # Spot VM 需要這個 toleration
    tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

# =============================================================================
# Docker-in-Docker 模式 (支援 container jobs 與 Docker actions)
# =============================================================================
containerMode:
  type: "dind"

# =============================================================================
# Listener Pod 配置 (接收 GitHub webhook 的 Pod)
# =============================================================================
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi

    # System Pool 有 CriticalAddonsOnly taint
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
